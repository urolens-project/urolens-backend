[tool.ruff]
target-version = "py313"

[tool.pyright]
extraPaths = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "D", "T20", "ANN", "B", "UP", "S"]
ignore = [
    "E501",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.File",
    "fastapi.Form",
    "src.core.rbac.RequireRole",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "D"]
"alembic/**" = ["E402"]
"alembic/versions/*.py" = ["D", "ANN"]
"seed_*.py" = ["T201", "S101", "E402", "D", "ANN"]
"scripts/*.py" = ["T201", "D", "ANN"]
"test_image_upload.py" = ["S311", "T201", "S105"]
"src/schemas/auth.py" = ["S105"]
"main.py" = ["E402"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
